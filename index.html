<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NORD — Clothing Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">NORD</a>
    <button class="cart-button" id="cartButton" aria-label="Åbn kurv">Kurv <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">NEW COLLECTION</p>
      <h1>Everyday pieces.<br>Made to last.</h1>
      <p>En enkel garderobe med moderne essentials.</p>
    </section>

    <section class="shop">
      <div class="shop-top">
        <h2>Shop</h2>
        <label>Sortér
          <select id="sort">
            <option value="default">Anbefalet</option>
            <option value="price-asc">Pris: lav → høj</option>
            <option value="price-desc">Pris: høj → lav</option>
            <option value="name">Navn A → Å</option>
          </select>
        </label>
      </div>
      <nav id="categories" class="categories" aria-label="Kategorier"></nav>
      <p id="status" class="status">Henter produkter…</p>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <aside id="cartDrawer" class="cart-drawer" aria-label="Indkøbskurv" aria-hidden="true">
    <div class="cart-head">
      <h2>Din kurv</h2>
      <button id="closeCart" aria-label="Luk kurv">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <strong>Total <span id="cartTotal">0 kr.</span></strong>
      <button id="checkout" class="button">Gå til checkout</button>
    </div>
  </aside>
  <div id="overlay" class="overlay"></div>

  <footer><p>NORD — Vanilla JavaScript webshop</p></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
